<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tias do Zap</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            min-height: 100vh;
            font-family: "Baloo 2",sans-serif;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 480px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7)
        }

        .bg-img {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            filter: brightness(0.45) saturate(1.2);
            z-index: 0
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,rgba(0,0,0,0.1) 0%,rgba(0,0,0,0.55) 50%,rgba(0,0,0,0.9) 100%);
            z-index: 1
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 2.5rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 520px;
            justify-content: flex-end
        }

        .wpp-icon {
            width: 64px;
            height: 64px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 0 0 6px rgba(37,211,102,0.2);
            animation: pulse 2s infinite
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 6px rgba(37,211,102,0.2)
            }

            50% {
                box-shadow: 0 0 0 16px rgba(37,211,102,0.05)
            }
        }

        .wpp-icon svg {
            width: 36px;
            height: 36px;
            fill: #fff
        }

        .badge {
            background: rgba(37,211,102,0.15);
            border: 1px solid rgba(37,211,102,0.4);
            color: #25D366;
            font-family: "IBM Plex Mono",monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 1rem;
            text-transform: uppercase
        }

        h1 {
            font-size: clamp(2.4rem,8vw,3.2rem);
            font-weight: 900;
            color: #fff;
            text-align: center;
            line-height: 1.05;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            margin-bottom: 0.3rem
        }

            h1 span {
                color: #25D366
            }

        .subtitle {
            color: rgba(255,255,255,0.65);
            text-align: center;
            margin-bottom: 1.75rem;
            font-family: "IBM Plex Mono",monospace;
            font-size: 12px;
            letter-spacing: 0.06em
        }

        .copy-box {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 1.25rem 1.5rem;
            width: 100%;
            margin-bottom: 1.25rem
        }

            .copy-box p {
                font-size: 0.95rem;
                color: rgba(255,255,255,0.88);
                line-height: 1.7;
                text-align: center
            }

                .copy-box p strong {
                    color: #fff;
                    font-weight: 700
                }

                .copy-box p .green {
                    color: #25D366;
                    font-weight: 700
                }

        .btn-copy {
            width: 100%;
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 800;
            font-family: "Baloo 2",sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }

            .btn-copy:hover {
                background: #1db954;
                transform: translateY(-2px);
                box-shadow: 0 8px 24px rgba(37,211,102,0.35)
            }

            .btn-copy:active {
                transform: translateY(0)
            }

        .footer {
            margin-top: 1.25rem;
            font-size: 11px;
            font-family: "IBM Plex Mono",monospace;
            color: rgba(255,255,255,0.3);
            text-align: center
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #25D366;
            color: #fff;
            font-family: "IBM Plex Mono",monospace;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap
        }

            .toast.show {
                opacity: 1
            }
    </style>
</head>
